[project]
name = "txnintel"
version = "0.1.0"
description = "Bank transaction intelligence demo: classification, recurring detection, revenue estimation, forecasting and anomaly detection on synthetic data"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
